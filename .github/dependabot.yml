version: 2
updates:
  - package-ecosystem: pip
    directory: "/auditar-issue"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/entregar-issue"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
