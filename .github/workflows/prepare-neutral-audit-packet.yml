name: Prepare neutral independent audit packet
# Both events load the workflow from the default branch. The candidate supplies
# data only; no manual dispatch can select its workflow or Python source.
on:
  workflow_run:
    workflows: ["Collect and certify exact-SHA handoff", "Collect main exact-SHA native evidence"]
    types: [completed]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  packet:
    name: Generate neutral audit packet
    if: >-
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.body == '/solverit-audit-packet'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted packet tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout the temporary protected develop parity tooling
        # Unavailable pin blocks only the fenced transition; normal branch checks continue.
        continue-on-error: true
        if: >-
          github.repository == 'crgasparoto-br/skill' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_run' || github.event_name == 'issue_comment')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2b93611605dd1b9e905f9eda949333ed22e79cf9
          path: .trusted-develop-parity
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collect certified exact-SHA source without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKET_ROOT: ${{ runner.temp }}/audit-packet
        run: >-
          python -IB scripts/dispatch_session_review.py --repo "$REPOSITORY"
          --event "$GITHUB_EVENT_PATH" --pinned "$GITHUB_WORKSPACE/.trusted-develop-parity" --packet-root "$PACKET_ROOT"
      - name: Upload neutral packet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neutral-independent-audit-packet
          path: ${{ runner.temp }}/audit-packet/
          if-no-files-found: error
          retention-days: 14
