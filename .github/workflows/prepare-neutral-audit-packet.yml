name: Prepare neutral independent audit packet
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Open pull request number"
        required: true
        type: number
      issue:
        description: "Canonical issue number"
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  packet:
    name: Generate neutral audit packet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted packet tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Collect certified exact-SHA source without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          python scripts/verify_session_review.py --repo "$REPOSITORY" \
            --pr "$PR_NUMBER" --issue "$ISSUE_NUMBER" \
            --packet-out "$RUNNER_TEMP/audit-packet/review-packet.json"
      - name: Upload neutral packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neutral-independent-audit-packet
          path: ${{ runner.temp }}/audit-packet/
          if-no-files-found: error
          retention-days: 14
