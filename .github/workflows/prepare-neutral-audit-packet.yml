name: Prepare neutral independent audit packet
# Both events load the workflow from the default branch. The candidate supplies
# data only; no manual dispatch can select its workflow or Python source.
on:
  workflow_run:
    workflows: ["Collect and certify exact-SHA handoff"]
    types: [completed]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  packet:
    name: Generate neutral audit packet
    if: >-
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.body == '/solverit-audit-packet'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted packet tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Collect certified exact-SHA source without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKET_ROOT: ${{ runner.temp }}/audit-packet
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from verify_session_review import evaluate, resolve_targets
          repo = os.environ["REPOSITORY"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes())
          targets = resolve_targets(repo, event)
          if not targets:
              raise SystemExit("BLOCK: no eligible PR for this packet request")
          destination = Path(os.environ["PACKET_ROOT"])
          results = [evaluate(repo, number, issue, destination / f"pr-{number}" / "review-packet.json")
                     for number, issue in targets]
          raise SystemExit(max(results))
          PY
      - name: Upload neutral packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neutral-independent-audit-packet
          path: ${{ runner.temp }}/audit-packet/
          if-no-files-found: error
          retention-days: 14
