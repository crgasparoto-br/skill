name: Generate MCP dependency lock artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate complete hashed lock
        run: |
          python -m pip install 'pip-tools==7.5.2'
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file integrations/github-audit-mcp/requirements.lock.txt integrations/github-audit-mcp/requirements.txt
          python -m pip install --require-hashes --no-deps -r integrations/github-audit-mcp/requirements.lock.txt
      - name: Publish lock as review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-audit-mcp-requirements-lock
          path: integrations/github-audit-mcp/requirements.lock.txt
          if-no-files-found: error
