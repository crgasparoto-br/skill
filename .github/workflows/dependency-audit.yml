name: Dependency audit

# A checagem de vulnerabilidade depende de banco externo e por isso fica em workflow
# separado: ela complementa a sequencia obrigatoria de `validate.yml` e nunca a substitui.
# Indisponibilidade do banco e reportada como UNKNOWN e reprova o job, porque ausencia de
# verificacao nao e verificacao de ausencia.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/requirements*.lock.txt"
      - "config/dependency-policy.json"
      - "scripts/validate_dependency_locks.py"
      - "scripts/audit_dependencies.py"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar lockfiles e politica de excecao
        run: python scripts/validate_dependency_locks.py --root .

      - name: Instalar pip-audit
        run: python -m pip install --quiet pip-audit

      - name: Auditar vulnerabilidades nos lockfiles
        run: python scripts/audit_dependencies.py --root .