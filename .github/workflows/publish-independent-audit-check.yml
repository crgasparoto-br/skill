name: Publish independent web audit check
on:
  workflow_run:
    workflows: ["Produce independent web audit"]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
concurrency:
  group: publish-independent-audit-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish independent web audit (exact SHA)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: independent-auditor
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned signature verification dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r auditar-issue/requirements-dev.lock.txt
      - name: Fetch exact producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          AUDIT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/independent-web-publication"
          gh run download "$AUDIT_RUN" -R "$TARGET_REPO" \
            -n signed-independent-audit \
            -D "$RUNNER_TEMP/independent-web-publication"
          test -f "$RUNNER_TEMP/independent-web-publication/external-audit.json"
      - name: Verify independent audit and publish exact-SHA check
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_AUDITORS_JSON: ${{ secrets.TRUSTED_AUDITORS_JSON }}
          TARGET_REPO: ${{ github.repository }}
          AUDIT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          if [ -z "$TRUSTED_AUDITORS_JSON" ]; then
            echo "BLOCK: trusted auditor registry unavailable"
            exit 2
          fi
          umask 077
          printf '%s' "$TRUSTED_AUDITORS_JSON" > "$RUNNER_TEMP/independent-web-publication/trusted-auditors.json"
          python scripts/publish_web_audit_check.py \
            --repository "$TARGET_REPO" \
            --producer-run-id "$AUDIT_RUN" \
            --report "$RUNNER_TEMP/independent-web-publication/external-audit.json" \
            --trusted-auditors "$RUNNER_TEMP/independent-web-publication/trusted-auditors.json"
