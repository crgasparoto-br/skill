name: Issue 88 MCP security regression
on:
  pull_request:
    branches:
      - develop
    paths:
      - 'integrations/github-delivery-mcp/**'
      - '.github/workflows/issue88-mcp-security.yml'
  # The feature PR can be unmergeable while develop evolves. Run security
  # regression on its exact immutable HEAD without pull_request_target.
  push:
    branches:
      - develop
      - feat/88-controlled-issue-delivery
    paths:
      - 'integrations/github-delivery-mcp/**'
      - '.github/workflows/issue88-mcp-security.yml'

permissions:
  contents: read

jobs:
  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated MCP and cryptography test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r integrations/github-delivery-mcp/requirements-sdk-pilot.txt
      - name: Compile MCP Python sources without deployment
        run: python -m compileall -q integrations/github-delivery-mcp
      - name: Full offline security and compatibility suite
        working-directory: integrations/github-delivery-mcp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Preview safe Ruff fixes for tracked delivery code
        if: always()
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.1
          ruff check --fix --unsafe-fixes --exit-zero --select I,F401,C408,SIM117,UP035,RUF005,PTH108,PTH101,SIM105,SIM108,TC003,B023,B904 integrations/github-delivery-mcp tests/test_skill_genericity_integration_scope.py
          echo '=== ISSUE88_RUFF_PATCH_BEGIN ==='
          git diff -- integrations/github-delivery-mcp tests/test_skill_genericity_integration_scope.py
          echo '=== ISSUE88_RUFF_PATCH_END ==='
