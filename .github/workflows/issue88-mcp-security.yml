name: Issue 88 MCP security regression
on:
  pull_request:
    branches:
      - develop
    paths:
      - 'integrations/github-delivery-mcp/**'
      - '.github/workflows/issue88-mcp-security.yml'
  # The feature PR can be unmergeable while develop evolves. Run security
  # regression on its exact immutable HEAD without pull_request_target.
  push:
    branches:
      - develop
      - feat/88-controlled-issue-delivery
    paths:
      - 'integrations/github-delivery-mcp/**'
      - '.github/workflows/issue88-mcp-security.yml'

permissions:
  contents: read

jobs:
  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated MCP and cryptography test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r integrations/github-delivery-mcp/requirements-sdk-pilot.txt
      - name: Compile MCP Python sources without deployment
        run: python -m compileall -q integrations/github-delivery-mcp
      - name: Full offline security and compatibility suite
        working-directory: integrations/github-delivery-mcp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Preview safe Ruff fixes for tracked delivery code
        if: always()
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.1
          ruff check --fix --unsafe-fixes --exit-zero --select I,F401,C408,SIM117,UP035,RUF005,PTH108,PTH101,SIM105,SIM108,TC003,B023,B904 integrations/github-delivery-mcp tests/test_skill_genericity_integration_scope.py
          echo '=== ISSUE88_RUFF_PATCH_BEGIN ==='
          git diff -- integrations/github-delivery-mcp tests/test_skill_genericity_integration_scope.py
          echo '=== ISSUE88_RUFF_PATCH_END ==='

      - name: Preview reviewed security API and nested context cleanup
        if: always()
        run: |
          python -m pip install --disable-pip-version-check libcst==1.8.5
          python - <<'PY'
          import re
          from pathlib import Path
          import libcst as cst
          RENAMES = {
              "BrokerOAuthDenied": "BrokerOAuthError",
              "DeliveryNotVerified": "DeliveryNotVerifiedError",
              "GitHubEvidenceRejected": "GitHubEvidenceRejectedError",
              "RuntimeDenied": "RuntimeDeniedError",
              "ProvisionDenied": "ProvisionDeniedError",
              "InvalidBrokerPolicy": "InvalidBrokerPolicyError",
              "BrokerDenied": "BrokerDeniedError",
          }
          class MergeNestedWith(cst.CSTTransformer):
              def leave_With(self, original_node, updated_node):
                  suite = updated_node.body
                  if not isinstance(suite, cst.IndentedBlock) or len(suite.body) != 1:
                      return updated_node
                  inner = suite.body[0]
                  if (not isinstance(inner, cst.With)
                          or getattr(inner, "leading_lines", ())
                          or suite.header.comment is not None):
                      return updated_node
                  return updated_node.with_changes(
                      items=(*updated_node.items, *inner.items), body=inner.body,
                  )
          source_root = Path("integrations/github-delivery-mcp")
          for file in sorted(source_root.rglob("*.py")):
              raw = file.read_text(encoding="utf-8")
              updated = raw
              for old, new in RENAMES.items():
                  updated = re.sub(r"\b" + old + r"\b", new, updated)
              if file.name == "test_broker_jwks_runtime.py":
                  updated = re.sub(r"\bDenied\b", "DeniedError", updated)
              if file.name in {"jobs.py", "check_evidence.py", "pr_binding.py"}:
                  updated = updated.replace("._connect(", ".connect(")
                  if file.name == "jobs.py":
                      updated = updated.replace("def _connect(", "def connect(")
              if file.name == "test_protected_broker_server.py":
                  updated = updated.replace("def fake_stat(path):\n                    if Path(path)",
                                            "def fake_stat(path, file_uid=file_uid, permissions=permissions):\n                    if Path(path)")
              if file.name == "workspace_container_check.py":
                  updated = updated.replace("except subprocess.TimeoutExpired:\n        cleanup_container(name, env)\n        raise RuntimeError(\"snapshot inspection timed out\")",
                                            "except subprocess.TimeoutExpired as exc:\n        cleanup_container(name, env)\n        raise RuntimeError(\"snapshot inspection timed out\") from exc")
              if file.name == "ops/check-keycloak-public-readiness.py":
                  updated = updated.replace('    if isinstance(scopes, list):\n        advertised = "yes" if SCOPE in scopes else "no"\n    else:\n        advertised = "unspecified"',
                                            '    advertised = ("yes" if SCOPE in scopes else "no") if isinstance(scopes, list) else "unspecified"')
              if file.name == "provision-broker-env.py":
                  updated = updated.replace("os.unlink(path)", "path.unlink()")
              if file.name == "protected_broker_server.py":
                  updated = updated.replace("os.chmod(SOCKET, 0o660)", "SOCKET.chmod(0o660)")
                  updated = updated.replace("os.unlink(SOCKET)", "SOCKET.unlink()")
              if file.name == "test_github_evidence_validation.py":
                  updated = updated.replace("self.runs + [self.runs[0]]", "[*self.runs, self.runs[0]]")
              if file.name in {"test_broker_jwks_signed.py", "test_protected_broker_server.py"}:
                  comments = ("._keys", "._expiry") if file.name == "test_broker_jwks_signed.py" else (
                      "broker._protected_path", "broker._read_persisted_binding",
                  )
                  lines = []
                  for line in updated.splitlines(keepends=True):
                      if any(value in line for value in comments) and "noqa:" not in line:
                          line = line.rstrip("\n") + "  # noqa: SLF001 - regression security test intentionally validates internal access boundary\n"
                      lines.append(line)
                  updated = "".join(lines)
              try:
                  updated = cst.parse_module(updated).visit(MergeNestedWith()).code
              except Exception as exc:
                  raise RuntimeError("refactor syntax blocked: " + file.name) from exc
              if updated != raw:
                  file.write_text(updated, encoding="utf-8")
          PY
          python -m compileall -q integrations/github-delivery-mcp
          echo '=== ISSUE88_SEMANTIC_PATCH_BEGIN ==='
          git diff -- integrations/github-delivery-mcp
          echo '=== ISSUE88_SEMANTIC_PATCH_END ==='
