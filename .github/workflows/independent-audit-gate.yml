name: Independent audit (exact SHA)

# Evaluate trusted policy from base SHA; never checkout untrusted PR HEAD.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  verify:
    name: Verify independent audit (exact SHA)
    if: github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify independent APPROVED review and exact-SHA technical CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          python scripts/verify_independent_pr_audit.py \
            --repo "$TARGET_REPO" --pr "$TARGET_PR" --base "$TARGET_BASE"
