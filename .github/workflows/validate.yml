name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structure and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # O lockfile é vinculado ao contexto em que foi resolvido: outra versão de Python
          # escolhe outra distribuição, com outro digest, e a instalação reprova. Manter a
          # mesma versão é o que faz o gate rodar no ambiente registrado.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            auditar-issue/requirements-dev.lock.txt
            entregar-issue/requirements-dev.lock.txt

      # A instalação usa o lockfile com `--require-hashes`: o ambiente que executa o gate é o
      # ambiente registrado, e uma distribuição que não corresponde ao digest reprova aqui.
      - name: Install test dependencies from lockfiles
        run: python -m pip install --require-hashes -r entregar-issue/requirements-dev.lock.txt -r auditar-issue/requirements-dev.lock.txt

      - name: Validate catalog
        run: python scripts/validate_repository.py

      - name: Validate machine-readable catalog
        run: python scripts/validate_catalog.py --root .

      - name: Validate generated contract copies
        run: python scripts/sync_contracts.py --check --root .

      - name: Validate documentation references
        run: python scripts/validate_docs.py --root .

      - name: Check generated catalog documentation
        run: python scripts/build_catalog_docs.py --check --root .

      - name: Validate release versioning
        run: python scripts/validate_versioning.py --root .

      - name: Validate platform adapters
        run: python scripts/validate_adapters.py --root .

      - name: Validate behavioral evaluation harness
        run: python scripts/validate_evals.py --root .

      - name: Replay behavioral evaluations and verify the report
        run: |
          python evals/run_evals.py --root . --results-dir evals/fixtures/results --report /tmp/eval-report.json > /tmp/eval-report-stdout.json
          python evals/run_evals.py --root . --verify-report /tmp/eval-report.json

      - name: Validate operational file reachability
        run: python scripts/validate_reachability.py --root .

      - name: Validate canonical issue templates
        run: python scripts/validate_issue_templates.py --root .

      - name: Validate context budget of control planes and references
        run: python scripts/validate_context_budget.py --root .

      - name: Validate genericity of permanent skill assets
        run: python entregar-issue/scripts/validate_skill_genericity.py --skill-root .

      - name: Validate navigability of skill references
        run: python scripts/validate_reference_indexes.py --root .

      - name: Validate dependency lockfiles and exception policy
        run: python scripts/validate_dependency_locks.py --root .

      - name: Run skill tests
        run: python -m pytest -q

      - name: Package entregar-issue skill
        run: python scripts/package_chatgpt_skill.py entregar-issue --output dist/skill.zip

      - name: Upload entregar-issue skill package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entregar-issue-skill-${{ github.sha }}
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 7
