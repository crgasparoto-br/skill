name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structure and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            auditar-issue/requirements-dev.txt
            entregar-issue/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r entregar-issue/requirements-dev.txt -r auditar-issue/requirements-dev.txt

      - name: Validate catalog
        run: python scripts/validate_repository.py

      - name: Validate machine-readable catalog
        run: python scripts/validate_catalog.py --root .

      - name: Validate generated contract copies
        run: python scripts/sync_contracts.py --check --root .

      - name: Validate documentation references
        run: python scripts/validate_docs.py --root .

      - name: Check generated catalog documentation
        run: python scripts/build_catalog_docs.py --check --root .

      - name: Validate release versioning
        run: python scripts/validate_versioning.py --root .

      - name: Validate platform adapters
        run: python scripts/validate_adapters.py --root .

      - name: Validate behavioral evaluation harness
        run: python scripts/validate_evals.py --root .

      - name: Run skill tests
        run: python -m pytest -q
