name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structure and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            auditar-issue/requirements-dev.txt
            entregar-issue/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r entregar-issue/requirements-dev.txt -r auditar-issue/requirements-dev.txt

      - name: Validate catalog
        run: python scripts/validate_repository.py

      - name: Run skill tests
        run: >-
          python -m pytest -q
          auditar-issue/tests
          corrigir-ci/tests
          design-interface/tests
          documentacao-repositorio/tests
          entregar-issue/tests
          fluxos-conversacionais/tests
          revisar-issue/tests
