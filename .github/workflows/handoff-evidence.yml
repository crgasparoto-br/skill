name: Collect and certify exact-SHA handoff

# GitHub-hosted only; do not certify semantic coverage automatically.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    name: Exact-head evidence starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_DIR: /tmp/handoff-evidence
    steps:
      - name: Checkout material PR head (not merge-preview)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            entregar-issue/requirements-dev.lock.txt
            auditar-issue/requirements-dev.lock.txt

      - name: Install locked validation dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r entregar-issue/requirements-dev.lock.txt -r auditar-issue/requirements-dev.lock.txt

      - name: Capture canonical Issue and initialize pending closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python entregar-issue/scripts/prepare_actions_handoff.py \
            --phase prepare --event "$GITHUB_EVENT_PATH" --root . --out "$EVIDENCE_DIR"

      - name: Execute full test suite against material SHA
        id: exact_tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv --junitxml="$EVIDENCE_DIR/pytest-exact-head.xml" > "$EVIDENCE_DIR/pytest-exact-head.log" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record test outcome with log digest
        if: ${{ always() && steps.exact_tests.outputs.exit_code != '' }}
        run: |
          python entregar-issue/scripts/prepare_actions_handoff.py \
            --phase record-tests --root . --out "$EVIDENCE_DIR" \
            --exit-code "${{ steps.exact_tests.outputs.exit_code }}"

      - name: Validate semantic closure and build certified handoff (fail closed)
        id: certificate
        if: ${{ always() && steps.exact_tests.outputs.exit_code != '' }}
        shell: bash
        run: |
          set +e
          python entregar-issue/scripts/prepare_actions_handoff.py \
            --phase certify --event "$GITHUB_EVENT_PATH" --root . --out "$EVIDENCE_DIR"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish evidence starter as Actions artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handoff-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Require validated certification before handoff
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ steps.certificate.outputs.exit_code }}" != "0" ]; then
            echo "::error::Certified handoff BLOCKED; inspect handoff-certification-status.json from the artifact."
            exit 1
          fi
          echo "Certificate generated; result-only publication and independent audit still required."
