name: Verify operator-attested session review

# This is a distinct, opt-in guarantee, never third-party audit impersonation.
# Trusted default/base code only; PR source and comments are untrusted DATA.
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issues:
    types: [edited]
  workflow_run:
    workflows: ["Validate skills", "Validate GitHub Audit MCP", "Collect and certify exact-SHA handoff"]
    types: [completed]
  push:
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: session-review-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    # No caller-selected workflow ref: every trigger below uses a protected base
    # or the default branch before the runner receives permission to write checks.
    if: >-
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate or revoke the exact-SHA session review
        id: verify
        env:
          SESSION_REVIEW_ORIGIN_DIR: ${{ runner.temp }}/session-review-origin-v2
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/verify_session_review.py --repo "$REPOSITORY" --event "$GITHUB_EVENT_PATH"
      - name: Preserve authenticated session review publication origin
        if: ${{ success() && steps.verify.outputs.review_origin_present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-review-origin-v2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-review-origin-v2/*.json
          if-no-files-found: error
          retention-days: 7
