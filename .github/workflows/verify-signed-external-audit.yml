name: Verify signed external audit (web-only)

# Manual verification of a separately produced signed audit artifact.
# NOT a PR required check: no independent auditor identity is provisioned here.
# Never use a passing verification run alone to authorize merge.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Open PR number"
        required: true
        type: number
      issue:
        description: "Canonical issue number"
        required: true
        type: number
      audit_run_id:
        description: "GitHub Actions run containing signed external audit artifact"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  verify-attestation:
    name: Verify signed external audit artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install signature verification dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r auditar-issue/requirements-dev.lock.txt
      - name: Resolve immutable PR target and download audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          AUDIT_RUN: ${{ inputs.audit_run_id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/web-audit"
          gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/web-audit/pr.json"
          gh api "repos/$TARGET_REPO/actions/runs/$AUDIT_RUN" > "$RUNNER_TEMP/web-audit/run.json"
          python - "$RUNNER_TEMP/web-audit" "$TARGET_REPO" "$PR_NUMBER" <<'PY'
          import json, pathlib, sys
          path, repository, number = pathlib.Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          pr = json.loads((path / "pr.json").read_text())
          run = json.loads((path / "run.json").read_text())
          if pr.get("state") != "open" or pr.get("number") != number:
              raise SystemExit("BLOCK: PR is no longer open")
          if pr.get("base", {}).get("ref") not in ("develop", "main"):
              raise SystemExit("BLOCK: unexpected PR base")
          if run.get("repository", {}).get("full_name") != repository:
              raise SystemExit("BLOCK: artifact run from foreign repository")
          if run.get("head_sha") != pr.get("head", {}).get("sha"):
              raise SystemExit("BLOCK: artifact run does not match current PR HEAD")
          if run.get("event") not in ("workflow_dispatch", "workflow_call"):
              raise SystemExit("BLOCK: unexpected audit producer event")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("BLOCK: source audit run is not successful")
          (path / "target.json").write_text(json.dumps({
              "repository": repository, "base_ref": pr["base"]["ref"],
              "base_sha": pr["base"]["sha"], "head_sha": pr["head"]["sha"]}))
          PY
          gh run download "$AUDIT_RUN" -R "$TARGET_REPO" -n signed-independent-audit -D "$RUNNER_TEMP/web-audit/artifact"
      - name: Verify signature and exact target
        env:
          TRUSTED_AUDITORS_JSON: ${{ secrets.TRUSTED_AUDITORS_JSON }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: |
          set -eu
          if [ -z "$TRUSTED_AUDITORS_JSON" ]; then
            echo "BLOCK: trusted auditor registry not configured"
            exit 2
          fi
          umask 077
          printf '%s' "$TRUSTED_AUDITORS_JSON" > "$RUNNER_TEMP/web-audit/trusted-auditors.json"
          python - "$RUNNER_TEMP/web-audit" "$ISSUE_NUMBER" <<'PY'
          import json, pathlib, subprocess, sys
          directory, issue = pathlib.Path(sys.argv[1]), sys.argv[2]
          target = json.loads((directory / "target.json").read_text())
          report = directory / "artifact" / "external-audit.json"
          if not report.is_file():
              raise SystemExit("BLOCK: signed external audit report is missing")
          cmd = [
              sys.executable, "scripts/verify_web_external_audit.py",
              "--report", str(report),
              "--trusted-auditors", str(directory / "trusted-auditors.json"),
              "--repository", target["repository"], "--issue", issue,
              "--base-ref", target["base_ref"], "--base-sha", target["base_sha"],
              "--head-sha", target["head_sha"],
          ]
          raise SystemExit(subprocess.run(cmd, check=False).returncode)
          PY
