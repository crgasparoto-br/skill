name: Publish certified handoff (trusted)

# workflow_run is evaluated on the default branch, not from PR source.
# This file must reach the trusted default branch before it becomes active.
on:
  workflow_run:
    workflows:
      - Collect and certify exact-SHA handoff
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  publish:
    name: Verify and publish result-only child
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare trusted Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install trusted pinned validation dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r entregar-issue/requirements-dev.lock.txt

      - name: Validate certificate and publish exact-head result-only child
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python entregar-issue/scripts/publish_actions_handoff.py --event "$GITHUB_EVENT_PATH"
