name: Produce independent web audit
on:
  workflow_run:
    workflows: ["Collect and certify exact-SHA handoff"]
    types: [completed]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
concurrency:
  group: independent-web-audit-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  audit:
    name: Produce independent signed evidence
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: independent-auditor
    steps:
      - name: Checkout trusted auditor policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned verification dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r auditar-issue/requirements-dev.lock.txt
      - name: Freeze source run, canonical PR and issue
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/independent-web-audit"
          printf '%s' "$EVENT_JSON" > "$RUNNER_TEMP/independent-web-audit/prs.json"
          python - "$RUNNER_TEMP/independent-web-audit" "$TARGET_REPO" "$SOURCE_RUN_ID" "$SOURCE_SHA" "$SOURCE_RUN_EVENT" "$SOURCE_RUN_CONCLUSION" <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          repo, source_id, sha, event, conclusion = sys.argv[2:]
          prs = json.loads((root / "prs.json").read_text())
          if event != "pull_request" or conclusion != "success" or len(prs) != 1:
              raise SystemExit("BLOCK: certified source must map to exactly one PR")
          number = prs[0]["number"]
          pr = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{number}"], text=True))
          if pr["head"]["sha"] != sha or pr["state"] != "open":
              raise SystemExit("BLOCK: certified SHA differs from current PR")
          matches = set(int(x) for x in re.findall(r"(?i)\b(?:closes|fixes|refs)\s+#(\d+)\b", pr.get("body") or ""))
          if len(matches) != 1:
              raise SystemExit("BLOCK: canonical issue missing or ambiguous")
          (root / "target.json").write_text(json.dumps({
              "pr": number, "issue": matches.pop(), "head_sha": sha, "source_run": source_id
          }))
          PY
      - name: Run read-only auditor against canonical issue and PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_AUDITOR_API_KEY: ${{ secrets.OPENAI_AUDITOR_API_KEY }}
          OPENAI_AUDITOR_MODEL: ${{ vars.OPENAI_AUDITOR_MODEL }}
          OPENAI_AUDITOR_URL: ${{ vars.OPENAI_AUDITOR_URL }}
          AUDITOR_PRIVATE_KEY_PEM: ${{ secrets.AUDITOR_PRIVATE_KEY_PEM }}
          AUDITOR_KEY_ID: ${{ vars.AUDITOR_KEY_ID }}
          TARGET_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ -z "$OPENAI_AUDITOR_API_KEY" ] || [ -z "$OPENAI_AUDITOR_URL" ] || [ -z "$OPENAI_AUDITOR_MODEL" ] || [ -z "$AUDITOR_PRIVATE_KEY_PEM" ] || [ -z "$AUDITOR_KEY_ID" ]; then
            echo "BLOCK: web auditor API, model or signing key is not provisioned"
            exit 2
          fi
          python - "$RUNNER_TEMP/independent-web-audit/target.json" "$TARGET_REPO" "$CURRENT_RUN_ID" <<'PY'
          import json, pathlib, subprocess, sys
          target = json.loads(pathlib.Path(sys.argv[1]).read_text())
          repo, current_run = sys.argv[2:]
          cmd = [
              sys.executable, "scripts/produce_web_independent_audit.py",
              "--repository", repo, "--pr", str(target["pr"]),
              "--issue", str(target["issue"]), "--expected-head", target["head_sha"],
              "--source-run", "github-actions-source:" + target["source_run"],
              "--audit-run", "github-actions:" + current_run,
              "--output", str(pathlib.Path(sys.argv[1]).parent / "external-audit.json"),
          ]
          raise SystemExit(subprocess.run(cmd, check=False).returncode)
          PY
      - name: Verify signed report before publication
        env:
          TRUSTED_AUDITORS_JSON: ${{ secrets.TRUSTED_AUDITORS_JSON }}
        run: |
          set -eu
          if [ -z "$TRUSTED_AUDITORS_JSON" ]; then
            echo "BLOCK: no previously trusted auditor registry"
            exit 2
          fi
          umask 077
          printf '%s' "$TRUSTED_AUDITORS_JSON" > "$RUNNER_TEMP/independent-web-audit/trusted-auditors.json"
          python auditar-issue/scripts/validate_external_audit_report.py \
            "$RUNNER_TEMP/independent-web-audit/external-audit.json" \
            --trusted-auditors "$RUNNER_TEMP/independent-web-audit/trusted-auditors.json"
      - name: Upload verified signed report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-independent-audit
          path: ${{ runner.temp }}/independent-web-audit/external-audit.json
          if-no-files-found: error
          retention-days: 7
