name: Validate GitHub Delivery Policy

on:
  push:
    paths:
      - "integrations/github-delivery-mcp/**"
      - ".github/workflows/github-delivery-policy.yml"
  pull_request:
    paths:
      - "integrations/github-delivery-mcp/**"
      - ".github/workflows/github-delivery-policy.yml"

permissions:
  contents: read

jobs:
  policy:
    name: Deny-by-default policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install MCP security test dependencies
        run: python -m pip install -r integrations/github-delivery-mcp/requirements-jwt.txt
      - name: Offline security tests
        working-directory: integrations/github-delivery-mcp
        run: python -m unittest discover -v -p 'test_*.py'
